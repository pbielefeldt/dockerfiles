name: "Build, Test and Push LaTexOS Docker Image"

on:
    push:
        branches: [main]
        paths: ["LaTeXOS/**"]
    pull_request:
        branches: [main]
        paths: ["LaTeXOS/**"]
    workflow_dispatch:  # Allow manual trigger from GitHub Web GUI

env:
    DOCKER_IMAGE_NAME: "latexos"
    DOCKER_IMAGE_VERSION: "16.0.1"

jobs:
    build:
        name: Build Docker image
        #runs-on: opensuse/leap
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              id: build_image
              run: |
                  cd LaTeXOS
                  docker buildx build --progress=plain --platform linux/amd64 --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}_temp --load --pull .

            - name: Save Docker image to archive
              run: docker save ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}_temp -o ${{ env.DOCKER_IMAGE_NAME }}_temp.tar

            - name: Upload Docker image as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.DOCKER_IMAGE_NAME }}_temp_image
                  path: ${{ env.DOCKER_IMAGE_NAME }}_temp.tar

    test:
        name: Test LaTeX Docker image
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Checkout repo
          uses: actions/checkout@v4
          with:
              persist-credentials: false            


        - name: Download Docker image artifact
          uses: actions/download-artifact@v4
          with:
              name: ${{ env.DOCKER_IMAGE_NAME }}_temp_image

        - name: Load Docker image
          run: docker load -i ${{ env.DOCKER_IMAGE_NAME }}_temp.tar

        - name: Run Make inside container (compile test files)
          run: |
              docker run --rm \
              -v "${{ github.workspace }}/LaTeXOS/testfiles:/work" \
              -w /work \
              ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}_temp \
              /bin/sh -c "make -C /work"

        - name: Upload generated PDF and logs
          if: always()
          uses: actions/upload-artifact@v4
          with:
              name: latexos-testfiles
              path: |
                  LaTeXOS/testfiles/main.pdf

    push:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Download Docker image artifact
              uses: actions/download-artifact@v4
              with:
                  name: ${{ env.DOCKER_IMAGE_NAME }}_temp_image

            - name: Load Docker image
              run: docker load -i ${{ env.DOCKER_IMAGE_NAME }}_temp.tar

            - name: Tag and push image to Docker Hub
              run: |
                  DOCKERHUB_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}"
                  # Use "_testing" tag for PRs
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      DOCKERHUB_VERSION="${{ env.DOCKER_IMAGE_VERSION }}_testing"
                  else
                      DOCKERHUB_VERSION=${{ env.DOCKER_IMAGE_VERSION }}
                      # set "latest" tag as well
                      docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}_temp ${DOCKERHUB_TAG}:latest
                  fi
                  docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}_temp ${DOCKERHUB_TAG}:${DOCKERHUB_VERSION}
                  docker push ${DOCKERHUB_TAG} --all-tags
     
